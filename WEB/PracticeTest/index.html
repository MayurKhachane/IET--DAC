<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Page</title>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <iframe id="timeFrame" srcdoc="
        <p>Current Date and Time : <span id='datetime'>

        </span></p>
        <script>
            function updateTime() {
                document.getElementById('datetime').innerText = 
                    
                    new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'} );
            }
            updateTime();
            setInterval(updateTime, 1000);
        </script>
    " width="400" height="100" style="border:5px solid black;"></iframe>

    <p><a href="calculate.html">Calculate</a></p>

</body>
</html>
